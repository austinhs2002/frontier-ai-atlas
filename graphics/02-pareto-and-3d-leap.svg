<text x="76" y="848" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#555D58">Source: Artificial Analysis values recorded in the November atlas. $10.02 divided by $0.56 is approximately 17.9.</text>
