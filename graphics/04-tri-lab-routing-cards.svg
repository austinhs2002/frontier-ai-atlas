<text x="76" y="848" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#555D58">Sources: native Terminal-Bench 4.1 and BOBA 20-step as recorded in the atlas. Fable’s long-horizon result is unknown.</text>
