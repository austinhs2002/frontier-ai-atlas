<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<title>The Gemini gap closes with effort.</title>
<rect width="1600" height="900" fill="#F6F3EC"/>
<text x="76" y="70" font-family="Georgia,serif" font-size="33" font-weight="650" fill="#222623">Frontier AI Atlas</text>
<text x="1278" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#555D58">FIELD EDITION  /  NOV 2026</text>
<path d="M76 95 H1524" stroke="#C7CABF"/>
<text x="76" y="198" font-family="Georgia,serif" font-size="76" font-weight="400" fill="#222623">The Gemini gap closes with effort.</text>
<text x="80" y="253" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#555D58">Carbon leads by ten AA Index points at low effort. Both reach 60 at high.</text>
<text x="76" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#555D58">EFFORT</text>
<text x="670" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#555D58">CARBON / INDEX</text>
<text x="1090" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#555D58">NEON / INDEX</text>
<path d="M76 356 H1524" stroke="#C7CABF"/>
<text x="76" y="416.8" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#222623">Low</text>
<text x="670" y="416.8" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="650" fill="#246444">54</text>
<text x="1090" y="416.8" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#222623">44</text>
<path d="M76 451 H1524" stroke="#C7CABF"/>
<text x="76" y="511.8" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#222623">Medium</text>
<text x="670" y="511.8" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="650" fill="#246444">58</text>
<text x="1090" y="511.8" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#222623">55</text>
<path d="M76 546 H1524" stroke="#C7CABF"/>
<text x="76" y="606.8" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#222623">High</text>
<text x="670" y="606.8" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="650" fill="#246444">60</text>
<text x="1090" y="606.8" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#222623">60</text>
<path d="M76 641 H1524" stroke="#C7CABF"/>
<text x="76" y="701.8" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#222623">Peak: high / xhigh</text>
<text x="670" y="701.8" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="650" fill="#246444">60</text>
<text x="1090" y="701.8" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#222623">61</text>
<path d="M76 800 H1524" stroke="#C7CABF"/>
<text x="76" y="848" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#555D58">Source: AA Intelligence Index v5 values recorded in the November atlas. Peak compares different effort settings.</text>
</svg>